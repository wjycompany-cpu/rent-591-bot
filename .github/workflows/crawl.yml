name: 591 租屋爬蟲

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    name: 抓取
    uses: ./.github/workflows/crawl-attempt.yml
    with:
      attempt: '1'
    secrets: inherit

  # 591 是以「來源 IP」判定封鎖，同一個 runner 重試無效（實測 11 次被擋的 run，
  # 三次嘗試全數 403，從未有一次靠重試救回來）。但每個 job 都是全新的 VM、
  # 換一個公網 IP，所以被擋時換一台 runner 重跑才有機會。
  #
  # 只在「列表頁被 403 擋下」時才啟動（index.js 會輸出 blocked=true）；
  # 解析錯誤之類的問題換 IP 也沒用，不會浪費這次重試。
  retry:
    name: 被擋時換一台 runner 再試
    needs: crawl
    if: needs.crawl.outputs.blocked == 'true'
    uses: ./.github/workflows/crawl-attempt.yml
    with:
      attempt: '2'
    secrets: inherit
